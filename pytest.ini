[pytest]
# pytest configuration for ekey HA component tests

# Test discovery
testpaths = tests/ha_component

# asyncio mode for pytest-asyncio
asyncio_mode = auto

# Show extra test summary info
addopts =
    -v
    --tb=short
    --strict-markers

# Custom markers
markers =
    asyncio: mark test as async (handled by pytest-asyncio)
    integration: mark test as integration test (requires running daemon)
