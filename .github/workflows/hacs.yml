# HACS validation.
#
# Separate from ha-component.yml on purpose: that one asks "is this integration
# correct?" (hassfest, pytest, the panel tests), this one asks "can HACS actually
# install it?" — repository layout, hacs.json, the manifest fields HACS reads, a
# description and topics on the GitHub repo. The two fail for different reasons and
# a green hassfest says nothing about the second.
#
# `category: integration` makes it check for custom_components/<domain>/ at the
# repository root, which is the whole reason this repo exists separately from the
# HA_dLine_module monorepo: HACS does not look inside subdirectories.

name: HACS

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, because this can start failing without anything here changing —
    # HACS tightens its requirements over time and a repository people install
    # from should find that out before they do.
    - cron: "0 4 * * 1"
  workflow_dispatch:

jobs:
  validate:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # HACS runs eight checks, each of which can be waived through `ignore`:
      #   archived  description  hacsjson  images  information  issues  topics  brands
      #
      # Two are waived here, and only two, because they are the ones that cannot be
      # satisfied from inside this repository:
      #
      #   brands — checks for brand assets, which live in the home-assistant/brands
      #     repository, not this one. Satisfying it means getting a PR merged there, and it
      #     is a requirement for being listed as a HACS DEFAULT repository, not for the
      #     custom-repository install this integration is distributed as. Left fatal it is
      #     a gate nothing in this repo can ever pass.
      #   images — checks the information file (README.md) embeds an image. There is no
      #     screenshot to embed yet. The honest fix is a screenshot of the sidebar panel,
      #     which is a user-facing integration that deserves one; DROP THIS IGNORE once
      #     the README has it.
      #
      # The other six stay fatal on purpose. `description` and `topics` are GitHub
      # repository settings, `issues` is the issue tracker being enabled — all three are
      # genuine HACS install requirements, all three are fixable in Settings in under a
      # minute, and a red run is the correct answer until they are. See
      # .github/CI_REQUIREMENTS.md for the checklist.
      - name: HACS action
        uses: hacs/action@main
        with:
          category: integration
          ignore: "brands images"
