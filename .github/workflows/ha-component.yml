# GitHub Actions CI — ekey HA custom component
#
# Runs on every push / PR that touches the HA component or its tests.
# Jobs:
#   1. hassfest  — validates manifest.json, strings.json, services.yaml
#                  against the current Home Assistant hassfest rules.
#   2. tests     — runs pytest unit tests for the Python component.

name: HA Component CI

on:
  push:
    paths:
      - "custom_components/**"
      - "tests/**"
      - ".github/workflows/ha-component.yml"
  pull_request:
    paths:
      - "custom_components/**"
      - "tests/**"
      - ".github/workflows/ha-component.yml"

jobs:
  # ------------------------------------------------------------------ hassfest
  hassfest:
    name: hassfest (HA manifest validation)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run hassfest
        uses: home-assistant/actions/hassfest@master
        # hassfest validates:
        #   - manifest.json fields (domain, version, iot_class, codeowners, …)
        #   - strings.json / translations/*.json schema
        #   - services.yaml schema
        # It reads the component from the path detected automatically.
        # If the component is not at the repo root, set the path explicitly:
        with:
          path: "custom_components/ekey_ha_app"

  # ------------------------------------------------------------------ pytest
  tests:
    name: Python unit tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Home Assistant 2026.x requires Python 3.13+; the old 3.11/3.12 matrix
        # could never have installed it, which is why the install step below used
        # to swallow the failure.
        python-version: ["3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        # No `|| true` anywhere. The tests import Home Assistant's real helpers on
        # purpose — Store, DataUpdateCoordinator, websocket_api, panel_custom — so
        # that an upstream rename fails HERE. Swallowing a failed install turned
        # every such failure into a silent skip.
        run: |
          pip install --upgrade pip
          pip install -r requirements_test.txt

      - name: Run tests
        run: |
          pytest tests/ha_component/ \
            --tb=short \
            --cov=custom_components/ekey_ha_app \
            --cov-report=term-missing \
            --cov-report=html \
            -v
        env:
          PYTHONPATH: .

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          # Generated by --cov-report=html above. Without that flag this step
          # uploaded nothing at all.
          path: htmlcov/

  # -------------------------------------------------------------------- panel
  panel:
    name: Panel render tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No install step and no package.json: the panel is plain ES modules served
      # straight to the browser, and the test stubs the four DOM APIs it touches.
      # Keeping it dependency-free is what makes it worth having — a bundler here
      # would cost more than the code it checks.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run panel render tests
        run: node tests/panel_render_test.mjs
