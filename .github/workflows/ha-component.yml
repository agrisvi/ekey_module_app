# GitHub Actions CI — ekey HA custom component
#
# Runs on every push / PR that touches the HA component or its tests.
# Jobs:
#   1. hassfest  — validates manifest.json, strings.json, services.yaml
#                  against the current Home Assistant hassfest rules.
#   2. tests     — runs pytest unit tests for the Python component.

name: HA Component CI

on:
  push:
    paths:
      - "custom_components/**"
      - "tests/**"
      - ".github/workflows/ha-component.yml"
  pull_request:
    paths:
      - "custom_components/**"
      - "tests/**"
      - ".github/workflows/ha-component.yml"

jobs:
  # ------------------------------------------------------------------ hassfest
  hassfest:
    name: hassfest (HA manifest validation)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # hassfest validates:
      #   - manifest.json fields (domain, version, iot_class, codeowners, …)
      #   - strings.json / translations/*.json schema
      #   - services.yaml schema
      #
      # NO `with:` here, and it must stay that way. home-assistant/actions/hassfest is a
      # composite action that declares no inputs at all — it just runs
      # `docker run -v $GITHUB_WORKSPACE:/github/workspace ghcr.io/home-assistant/hassfest`.
      # The `path: custom_components/ekey_ha_app` that used to be here was therefore inert:
      # GitHub answered it with an "Unexpected input(s) 'path'" warning on every run and
      # hassfest ignored it. It scans `custom_components/*` under the workspace root, which
      # is exactly where this component lives, so there was never anything to point it at.
      - name: Run hassfest
        uses: home-assistant/actions/hassfest@master

  # ------------------------------------------------------------------ pytest
  tests:
    name: Python unit tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 3.14, not 3.13, and this is a hard constraint rather than a preference:
        # homeassistant 2026.3.0 moved its floor to `requires_python >=3.14.2` (2026.2.3 was
        # the last release installable on 3.13). requirements_test.txt asks for >=2026.6.0,
        # so on 3.13 pip has NO candidate at all and the install step fails outright —
        # which is what it was doing, loudly, since the `|| true` was removed. Check
        # https://pypi.org/pypi/homeassistant/json before moving either number: the pair
        # (HA floor, Python version) has to stay consistent or this job cannot start.
        python-version: ["3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          # Home Assistant pulls a large dependency tree; caching it is the difference
          # between a job that runs in a minute and one that spends most of its time in pip.
          cache: pip
          cache-dependency-path: requirements_test.txt

      - name: Install test dependencies
        # No `|| true` anywhere. The tests import Home Assistant's real helpers on
        # purpose — Store, DataUpdateCoordinator, websocket_api, panel_custom — so
        # that an upstream rename fails HERE. Swallowing a failed install turned
        # every such failure into a silent skip.
        run: |
          pip install --upgrade pip
          pip install -r requirements_test.txt

      - name: Run tests
        run: |
          pytest tests/ha_component/ \
            --tb=short \
            --cov=custom_components/ekey_ha_app \
            --cov-report=term-missing \
            --cov-report=html \
            -v
        env:
          PYTHONPATH: .

      # `if: always()` because the run you most want the coverage from is the one that
      # failed — pytest writes the report before it reports the failure, and without this
      # the artefact is only ever produced for runs nobody needs to investigate.
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          # Generated by --cov-report=html above. Without that flag this step
          # uploaded nothing at all.
          path: htmlcov/
          if-no-files-found: ignore

  # -------------------------------------------------------------------- panel
  panel:
    name: Panel render tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No install step and no package.json: the panel is plain ES modules served
      # straight to the browser, and the test stubs the four DOM APIs it touches.
      # Keeping it dependency-free is what makes it worth having — a bundler here
      # would cost more than the code it checks.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run panel render tests
        run: node tests/panel_render_test.mjs
